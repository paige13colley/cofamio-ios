<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>You're offline · CoFamio</title>
    <meta name="theme-color" content="#4f46e5" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #4f46e5;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 420px; }
      .mark {
        width: auto; min-width: 108px; padding: 0 14px; height: 84px; margin: 0 auto 20px;
        border-radius: 22px; background: rgba(255, 255, 255, 0.14); display: flex;
        align-items: center; justify-content: center; font-weight: 800; font-size: 24px;
        letter-spacing: -0.5px;
      }
      h1 { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
      p { font-size: 15px; line-height: 1.55; opacity: 0.92; }
      button {
        margin-top: 24px; background: #fff; color: #4f46e5; border: none; cursor: pointer;
        padding: 12px 22px; border-radius: 12px; font-weight: 700; font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">CoFamio</div>
      <h1>You're offline</h1>
      <p>CoFamio isn't reachable right now. Check your connection and try again — your data is safe and will sync when you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
